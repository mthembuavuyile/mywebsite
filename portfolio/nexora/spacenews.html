<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora – Spaceflight Intelligence Hub</title>
    <meta http-equiv="refresh" content="1;url=index.html?mode=space">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
            background: #0c0e17;
            color: #f0f3fd;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .redirect-card {
            background: #141824;
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 24px;
            padding: 40px;
            max-width: 480px;
            box-shadow: 0 10px 40px rgba(0, 242, 254, 0.15);
        }

        .icon-orb {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #00f2fe, #6382ff);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: #0c0e17;
            margin: 0 auto 20px;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.4);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #00f2fe;
        }

        p {
            color: #8c95ba;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .launch-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #6382ff, #b268ff);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .launch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 130, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="redirect-card">
        <div class="icon-orb">
            <i class="fas fa-rocket"></i>
        </div>
        <h1>Spaceflight Intelligence has moved to Nexora!</h1>
        <p>Live Spaceflight News, SpaceX updates, NASA coverage & Mars telemetry are now fully integrated into Nexora.</p>
        <a href="index.html?mode=space" class="launch-btn">
            <i class="fas fa-satellite"></i> Launch Nexora Space Hub
        </a>
    </div>

    <script>
        // Automatic redirect to Nexora in Space mode
        setTimeout(() => {
            window.location.href = 'index.html?mode=space';
        }, 1200);
    </script>
</body>
</html>
