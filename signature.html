<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Signature - Avuyile Mthembu</title>
    <style>
        /* This style block is for the browser view only. 
           Email clients ignore this, which is why everything must be inline. */
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background-color: #f9fafb;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #111827;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .header p {
            color: #6b7280;
            margin-bottom: 20px;
        }
        .copy-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .copy-btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px -2px rgba(37, 99, 235, 0.3);
        }
        .copy-btn:active {
            transform: translateY(0);
        }
        .copy-btn svg {
            width: 20px;
            height: 20px;
        }
        .copy-btn.success {
            background-color: #10b981;
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
        }
        .signature-container {
            background: white;
            padding: 30px;
            border: 1px dashed #ccc;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Your Email Signature</h1>
        <p>Ready to use! Just click the button below and paste it into your email client.</p>
        <button id="copyBtn" class="copy-btn">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
            </svg>
            <span id="btnText">Copy Signature</span>
        </button>
    </div>

    <div class="signature-container">
        <!-- START OF SIGNATURE TO COPY -->
        <table id="signatureTable" cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, sans-serif; font-size: 14px; color: #333333; line-height: 1.5; background-color: #ffffff;">
            <tr>
                <!-- Profile Image -->
                <td style="padding-right: 20px; border-right: 2px solid #2563eb; vertical-align: top;">
                    <img src="https://avuyilemthembu.co.za/assets/images/avuyile2.jpg" alt="Avuyile Mthembu" width="100" height="100" style="border-radius: 50%; display: block; width: 100px; height: 100px; object-fit: cover; border: 3px solid #eff6ff;">
                </td>
                
                <!-- Signature Details -->
                <td style="padding-left: 20px; vertical-align: top;">
                    <!-- Name & Title -->
                    <h2 style="margin: 0 0 2px 0; font-size: 18px; color: #111827; font-weight: bold; font-family: Arial, sans-serif;">
                        Avuyile Mthembu
                    </h2>
                    <p style="margin: 0 0 12px 0; font-size: 14px; color: #4b5563; font-family: Arial, sans-serif;">
                        Full-Stack Software Developer & Founder of <strong>Vylex</strong>
                    </p>
                    
                    <!-- Contact Info Table -->
                    <table cellpadding="0" cellspacing="0" border="0" style="font-size: 13px; color: #4b5563; font-family: Arial, sans-serif;">
                        <tr>
                            <td style="padding-bottom: 5px;">
                                <span style="color: #2563eb; font-weight: bold; margin-right: 6px;">P:</span> 
                                <a href="tel:0648784287" style="color: #4b5563; text-decoration: none;">064 878 4287</a>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding-bottom: 5px;">
                                <span style="color: #2563eb; font-weight: bold; margin-right: 6px;">E:</span> 
                                <a href="mailto:info@avuyilemthembu.co.za" style="color: #4b5563; text-decoration: none;">info@avuyilemthembu.co.za</a>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding-bottom: 5px;">
                                <span style="color: #2563eb; font-weight: bold; margin-right: 6px;">W:</span> 
                                <a href="https://avuyilemthembu.co.za" style="color: #4b5563; text-decoration: none;">avuyilemthembu.co.za</a>
                            </td>
                        </tr>
                    </table>
                    
                    <!-- Social Links -->
                    <table cellpadding="0" cellspacing="0" border="0" style="margin-top: 12px;">
                        <tr>
                            <td style="padding-right: 12px;">
                                <a href="https://www.linkedin.com/in/mthembuavuyile" target="_blank" style="text-decoration: none;">
                                    <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn" width="20" height="20" style="display: block; width: 20px; height: 20px;">
                                </a>
                            </td>
                            <td style="padding-right: 12px;">
                                <a href="https://github.com/mthembuavuyile" target="_blank" style="text-decoration: none;">
                                    <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub" width="20" height="20" style="display: block; width: 20px; height: 20px;">
                                </a>
                            </td>
                            <td style="padding-right: 12px;">
                                <a href="https://twitter.com/MthembuAvuyile" target="_blank" style="text-decoration: none;">
                                    <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter" width="20" height="20" style="display: block; width: 20px; height: 20px;">
                                </a>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
        <!-- END OF SIGNATURE TO COPY -->
    </div>

    <script>
        document.getElementById('copyBtn').addEventListener('click', function() {
            const signatureTable = document.getElementById('signatureTable');
            const selection = window.getSelection();
            const range = document.createRange();
            
            // Select the table contents
            range.selectNode(signatureTable);
            selection.removeAllRanges();
            selection.addRange(range);
            
            try {
                // Execute copy
                document.execCommand('copy');
                
                // Update button UI
                const btn = this;
                const btnText = document.getElementById('btnText');
                const originalText = btnText.innerText;
                
                btnText.innerText = 'Copied Successfully!';
                btn.classList.add('success');
                
                // Reset after 2.5 seconds
                setTimeout(() => {
                    btnText.innerText = originalText;
                    btn.classList.remove('success');
                    selection.removeAllRanges();
                }, 2500);
                
            } catch (err) {
                console.error('Failed to copy', err);
                alert('Failed to copy signature automatically. Please select it manually.');
            }
        });
    </script>
</body>
</html>
